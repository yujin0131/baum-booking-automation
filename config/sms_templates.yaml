# 일반 객실 입실 안내 (CHECK_IN_GUIDE - 일반)
check_in_guide_normal: |
  안녕하세요, {guest_name} 님 (방긋)
  오늘 입실 예정인 스테이튠(음표) 입니다.

  체크인 시간은 오후 4시, 체크아웃 시간은 오전 11시까지입니다.
  저희는 셀프 체크인 시스템으로 운영되고 있으며, 예약하신 객실은 {room_number}호입니다. 객실 비밀번호는 <{room_password}>입니다.

  ✅ 자세한 숙소 안내와 추천 관광지, 맛집 리스트, 와이파이 비밀번호를 아래 링크에 정리해 두었으니, 한번 읽어주시면 감사하겠습니다 :)
  https://naver.me/I55Re2hF

  ✅ 짐보관 안내
  - 체크인 전 짐보관 : 예약하신 객실 앞에 두시면 됩니다.
  - 체크인 후 짐보관 : 공용공간에 보관하시면 됩니다.
  - 짐옮김이 서비스 이용시에는 예약하신 객실 호수를 기재하여, 객실 앞에 놔달라고 하시면 됩니다.

  ✅ 방 안에서 물을 제외한 다른 음식물은 섭취가 어려우니 이용에 참고 부탁드릴게요

  ✅ 같은 건물 지하에 뮤직바를 운영중인데, 게스트하우스 고객님들에게 10% 할인 혜택 제공해드리고 있습니다! 결제시 말씀해주세요 (하트)
  영업시간 : PM 8 : 00 ~ AM 1 : 00

  저희 스테이튠에서 소중한 추억 만들고 가셨으면 좋겠습니다 (방긋)

