<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}예약 자동화 시스템{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #f8f9fa;
            padding-left: 0.5rem;
            padding-right: 0.5rem;
        }
        .sidebar .nav-link {
            padding-left: 0.75rem;
            padding-right: 0.75rem;
        }
        .nav-link.active {
            background-color: #0d6efd;
            color: white !important;
        }
        .stat-card {
            border-left: 4px solid #0d6efd;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar" style="max-width: 200px;">
                <div class="position-sticky pt-3">
                    <h6 class="mb-3">
                        <i class="bi bi-calendar-check"></i> 예약 시스템
                    </h6>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
                                <i class="bi bi-speedometer2"></i> 대시보드
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if '/bookings' in request.url.path %}active{% endif %}" href="/bookings">
                                <i class="bi bi-calendar3"></i> 예약 관리
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if '/sms' in request.url.path %}active{% endif %}" href="/sms">
                                <i class="bi bi-chat-dots"></i> SMS 로그
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if '/kakao-templates' in request.url.path %}active{% endif %}" href="/kakao-templates">
                                <i class="bi bi-chat-square-text"></i> 카카오 템플릿
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col ms-sm-auto px-md-4">
                <div class="pt-3 pb-2 mb-3">
                    {% block content %}{% endblock %}
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
